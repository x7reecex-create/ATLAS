*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent)}.shell{max-width:1150px;margin:auto;min-height:100dvh;padding:0 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0;border-bottom:1px solid var(--border)}.logo{display:flex;gap:11px;align-items:center}.mark{width:36px;height:36px;display:grid;place-items:center;background:#332027;color:#f9cbd3;border:1px solid #70414b;border-radius:12px;font-size:19px;font-weight:900}.wordmark{font-size:19px;letter-spacing:.19em;font-weight:800}.beta{font-size:10px;letter-spacing:.13em;color:var(--accent);margin-left:8px}.tagline{font-size:11px;color:var(--muted);margin-top:2px}.status{border:1px solid var(--border);padding:8px 12px;border-radius:99px;color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:195px minmax(0,1fr);gap:35px;padding-top:28px}.side{display:flex;flex-direction:column;gap:6px}.nav{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;font-size:14px}.nav.active{color:var(--text);background:var(--accent-bg);border-color:#6b3a46}.nav:hover{background:var(--elev)}.nav .symbol{font-size:17px;width:24px}.main{min-width:0}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.17em;color:var(--accent);font-weight:700}.page-title{font-size:clamp(29px,5vw,44px);letter-spacing:-.045em;line-height:1.1;margin:9px 0 10px;font-weight:730}.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:21px}.card h2{font-size:15px;letter-spacing:-.015em;margin:0 0 12px}.card p{color:var(--muted);font-size:13px;line-height:1.55}.stat{font-size:36px;font-weight:750;letter-spacing:-.045em;margin:10px 0}.stat-label{color:var(--muted);font-size:12px}.wide{grid-column:1/-1}.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{appearance:none;border:1px solid var(--border);color:var(--text);background:var(--elev);border-radius:11px;padding:10px 14px;font-weight:650;font-size:13px;min-height:42px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#160c0f}.btn.secondary{background:transparent}.btn.small{padding:7px 10px;min-height:34px;font-size:12px}.btn.danger{color:#ffa8b3}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 17px}.empty{padding:32px 14px;text-align:center;color:var(--muted);border:1px dashed #48434a;border-radius:14px;font-size:13px;line-height:1.6}.record{display:flex;gap:13px;align-items:flex-start;border-bottom:1px solid var(--border);padding:15px 0}.record:last-child{border-bottom:0}.record-main{min-width:0;flex:1}.record-title{font-weight:650;font-size:14px;overflow-wrap:anywhere}.record-title.done{text-decoration:line-through;color:var(--muted)}.record-meta{font-size:11px;color:var(--muted);margin-top:5px}.record-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}.record-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.check{width:24px;height:24px;accent-color:var(--accent);margin:0;flex-shrink:0}.pill{padding:4px 8px;border-radius:99px;background:var(--elev);border:1px solid var(--border);color:var(--muted);font-size:11px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 18px}.day{padding:10px 2px;border-radius:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);text-align:center;min-width:0}.day strong{display:block;color:var(--text);font-size:17px;margin-top:5px}.day.selected{background:var(--accent-bg);border-color:#87505c}.day small{font-size:10px}.form-row{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.form-row label{font-size:12px;font-weight:650;color:var(--muted)}.field{width:100%;padding:12px 13px;min-height:44px;background:#0d0e12;border:1px solid #4d4852;color:var(--text);border-radius:10px}.field::placeholder{color:#797581}textarea.field{min-height:105px;resize:vertical}.dialog{border:1px solid #62515b;border-radius:21px;background:#19191f;color:var(--text);width:min(94vw,460px);padding:24px;max-height:90dvh;overflow:auto;box-shadow:0 25px 80px #0009}.dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}.dialog h2{margin:0 0 18px;font-size:22px}.dialog-footer{display:flex;gap:10px;justify-content:flex-end}.welcome{max-width:575px;margin:9vh auto 0}.welcome h1{font-size:clamp(40px,8vw,62px);letter-spacing:-.06em;margin:18px 0}.welcome p{font-size:15px;line-height:1.75;color:var(--muted)}.privacy{padding:15px;background:var(--elev);border-radius:12px;margin:22px 0;color:var(--muted);line-height:1.6;font-size:13px}.notice{margin:12px 0;color:var(--muted);font-size:13px;line-height:1.55}.notice strong{color:var(--text)}.bottom{display:none}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#34313b;border:1px solid #72636c;border-radius:14px;padding:12px 18px;z-index:20;font-size:13px;max-width:min(90vw,500px);box-shadow:0 8px 30px #0009}.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.stack>*+*{margin-top:12px}.full{width:100%}.subtle{color:var(--muted);font-size:12px}.settings-actions{display:flex;gap:10px;flex-wrap:wrap}.headline{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.headline .lead{margin-bottom:0}.count{font-size:11px;color:var(--muted)}@media(max-width:750px){.shell{padding:0 16px 105px}.top{padding:16px 0}.status{font-size:10px}.layout{display:block;padding-top:22px}.side{display:none}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#151519f5;border-top:1px solid var(--border);padding:8px max(7px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));justify-content:space-around;gap:3px;z-index:10;backdrop-filter:blur(12px)}.bottom .nav{flex:1;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:5px 2px;text-align:center;font-size:10px}.bottom .nav .symbol{font-size:20px;width:auto}.page-title{font-size:32px}.week{gap:4px}.day{padding:9px 0}.day strong{font-size:14px}.day small{font-size:9px}.record{gap:8px}.record-actions .btn{font-size:11px;padding:5px 7px;min-height:30px}.welcome{margin:5vh auto 0}}@media(max-width:390px){.grid{grid-template-columns:1fr}.status{padding:7px 8px}.week{gap:2px}.card{padding:14px}}@media(prefers-reduced-motion:no-preference){.card,.btn,.nav{transition:background .15s,border-color .15s,transform .15s}.btn:active{transform:scale(.985)}}

<body>
<div class="shell">
<header class="top"><div class="logo"><span class="mark" aria-hidden="true">A</span><div><div class="wordmark">ATLAS<span class="beta">BETA</span></div><div class="tagline">MAKE SPACE FOR LIFE</div></div></div><span class="status">Private to this browser</span></header>
<div id="welcome" hidden></div>
<div id="workspace" hidden><div class="layout"><nav class="side" id="side" aria-label="Main navigation"></nav><main class="main" id="view" tabindex="-1"></main></div></div>
</div>
<nav class="bottom" id="bottom" aria-label="Mobile navigation" hidden></nav>
<dialog id="editor" class="dialog" aria-labelledby="editorTitle"><form method="dialog" id="editorForm"><h2 id="editorTitle">Add</h2><div id="editorFields"></div><div class="dialog-footer"><button type="button" class="btn secondary" id="cancelEditor">Cancel</button><button type="submit" class="btn primary" id="saveEditor">Save</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
const KEY='atlas-family-beta:workspace:v1';
const MAX={tasks:500,events:300,notes:200,habits:60};
const VIEWS=[['home','⌂','Home'],['tasks','✓','Tasks'],['plan','▦','Plan'],['notes','▤','Notes'],['more','✦','More']];
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date;return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dateValid=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return Number.isFinite(+d)&&d.getFullYear()===Number(s.slice(0,4))&&d.getMonth()+1===Number(s.slice(5,7))&&d.getDate()===Number(s.slice(8,10))};
const dateLabel=s=>dateValid(s)?new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'No date';
const uuid=()=>crypto.randomUUID();
const initial=()=>({version:1,name:'',tasks:[],events:[],notes:[],habits:[]});
function normalise(o){if(!o||typeof o!=='object'||Array.isArray(o)||o.version!==1)throw Error('This is not an ATLAS Beta backup.');const d=initial();d.name=String(o.name||'').slice(0,40);for(const type of Object.keys(MAX)){if(!Array.isArray(o[type])||o[type].length>MAX[type])throw Error('Invalid or oversized '+type+' collection.');d[type]=o[type].map(item=>{if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id||item.id.length>100)throw Error('Invalid '+type+' record.');const result={id:item.id,title:String(item.title||'').slice(0,120),created:Number(item.created)||Date.now()};if(!result.title.trim())throw Error('An entry has no title.');if(type==='tasks'){result.done=!!item.done;result.due=dateValid(item.due)?item.due:''}if(type==='events'){result.date=dateValid(item.date)?item.date:'';if(!result.date)throw Error('Invalid event date.');result.time=/^([01]\d|2[0-3]):[0-5]\d$/.test(item.time||'')?item.time:''}if(type==='notes')result.body=String(item.body||'').slice(0,6000);if(type==='habits')result.days=Array.isArray(item.days)?[...new Set(item.days.filter(dateValid))].slice(-366):[];return result})}return d}
let data,view='home',selected=today(),editing=null,loadFailure=false,originalRaw=null;
function load(){try{originalRaw=localStorage.getItem(KEY);data=originalRaw?normalise(JSON.parse(originalRaw)):initial()}catch(err){loadFailure=true;data=initial();showToast('Saved data could not be read. Changes are disabled; export the original data from settings.')}};
function save(){if(loadFailure){showToast('Cannot save while a damaged workspace is present.');return false}try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){showToast('Storage is full or unavailable. Export your backup.');return false}}
function showToast(s){const n=$('toast');n.textContent=s;n.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>n.hidden=true,4500)}
function shortName(){return data.name.trim()||'there'}
function button(label,action,id='',more=''){return '<button type="button" class="btn small" data-action="'+action+'" data-id="'+escapeHtml(id)+'" '+more+'>'+escapeHtml(label)+'</button>'}
function record(item,type){const done=type==='tasks'&&item.done;const meta=type==='tasks'?(item.due?dateLabel(item.due):'Anytime'):type==='events'?(dateLabel(item.date)+(item.time?' · '+item.time:'')):type==='habits'?(item.days.includes(today())?'Done today':'Not done yet'):'Note';let extra='';if(type==='notes'&&item.body)extra='<div class="record-body">'+escapeHtml(item.body)+'</div>';const toggle=type==='tasks'||type==='habits';return '<div class="record">'+(toggle?'<input type="checkbox" class="check" aria-label="'+escapeHtml(type==='tasks'?'Complete '+item.title:'Check in '+item.title)+'" data-check="'+type+'" data-id="'+escapeHtml(item.id)+'" '+(done||type==='habits'&&item.days.includes(today())?'checked':'')+'>':'')+'<div class="record-main"><div class="record-title '+(done?'done':'')+'">'+escapeHtml(item.title)+'</div><div class="record-meta">'+escapeHtml(meta)+'</div>'+extra+'</div><div class="record-actions">'+button('Edit','edit-'+type,item.id)+button('Delete','delete-'+type,item.id)+'</div></div>'}
function list(items,type,empty){return items.length?items.map(x=>record(x,type)).join(''):'<div class="empty">'+escapeHtml(empty)+'</div>'}
function heading(k,title,subtitle){return '<div class="kicker">'+escapeHtml(k)+'</div><div class="page-title">'+escapeHtml(title)+'</div><p class="lead">'+escapeHtml(subtitle)+'</p>'}
function header(title,action,label){return '<div class="headline"><h2>'+escapeHtml(title)+'</h2>'+(action?button(label||'Add new',action):'')+'</div>'}
function home(){const open=data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4),upcoming=data.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4),checked=data.habits.filter(h=>h.days.includes(today())).length;return heading('Your space','Hello, '+shortName()+'.','A calmer place to organise the things that matter.')+'<div class="grid"><section class="card"><div class="stat-label">Tasks to do</div><div class="stat">'+data.tasks.filter(t=>!t.done).length+'</div><div class="stat-label">One thing at a time.</div></section><section class="card"><div class="stat-label">Habits checked today</div><div class="stat">'+checked+' <span class="subtle">/ '+data.habits.length+'</span></div><div class="stat-label">Small steps count.</div></section><section class="card wide">'+header('Up next','new-tasks','+ Task')+list(open,'tasks','Nothing to do yet. Add a task and give yourself a starting point.')+'</section><section class="card wide">'+header('Coming up','new-events','+ Plan')+list(upcoming,'events','No plans entered. Make space for something important.')+'</section><section class="card wide"><h2>Make it yours</h2><p>This is your own beta workspace. It starts empty, stays in this browser and is not linked to anyone else’s ATLAS account.</p></section></div>'}
function tasks(){const open=data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),done=data.tasks.filter(t=>t.done);return heading('Get things done','Tasks','Keep it simple. Add what matters, then tick it off.')+'<div class="toolbar"><button class="btn primary" data-action="new-tasks">+ Add task</button><span class="count">'+open.length+' open · '+done.length+' done</span></div><section class="card">'+header('To do')+list(open,'tasks','Your list is clear. Add your first task.')+'</section>'+(done.length?'<section class="card" style="margin-top:13px"><h2>Completed</h2>'+list(done.slice(-20).reverse(),'tasks','')+'</section>':'')}
function shift(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}
function plan(){const week=Array.from({length:7},(_,i)=>shift(selected,-((new Date(selected+'T12:00:00').getDay()+6)%7)+i));const dates=week.map(d=>'<button class="day '+(d===selected?'selected':'')+'" data-action="choose-day" data-date="'+d+'" aria-pressed="'+(d===selected?'true':'false')+'"><small>'+dateLabel(d).split(' ')[0]+'</small><strong>'+Number(d.slice(-2))+'</strong></button>').join('');const events=data.events.filter(e=>e.date===selected).sort((a,b)=>a.time.localeCompare(b.time));const due=data.tasks.filter(t=>t.due===selected&&!t.done);return heading('Stay on track','Your plan','See what is coming up without a crowded calendar.')+'<div class="toolbar"><button class="btn primary" data-action="new-events">+ Add plan</button><button class="btn" data-action="today">Today</button><button class="btn" data-action="prev-week" aria-label="Previous week">←</button><button class="btn" data-action="next-week" aria-label="Next week">→</button></div><div class="week" role="group" aria-label="Select date">'+dates+'</div><section class="card">'+header(dateLabel(selected))+'<div class="record-meta" style="margin-bottom:11px">Appointments and plans</div>'+list(events,'events','Nothing scheduled on this day.')+(due.length?'<div class="record-meta" style="margin:20px 0 8px">Tasks due</div>'+list(due,'tasks',''):'')+'</section>'}
function notes(){return heading('Clear your head','Notes','A place for ideas, reminders and anything worth keeping.')+'<div class="toolbar"><button class="btn primary" data-action="new-notes">+ Add note</button></div><section class="card">'+list([...data.notes].reverse(),'notes','Your notes will appear here. Write your first one.')+'</section>'}
function more(){return heading('Personalise','Your space','Build small habits and look after your own information.')+'<div class="grid"><section class="card wide">'+header('Daily habits','new-habits','+ Habit')+list(data.habits,'habits','Start with one small habit you want to repeat.')+'</section><section class="card wide"><h2>Backup and privacy</h2><p><strong>Local-only beta:</strong> there are no cloud accounts or syncing yet. Everything stays on this device, in this browser. If you clear browser data or change devices, you may lose your entries. Make a backup first.</p><div class="settings-actions"><button class="btn" data-action="export">Export backup</button><button class="btn" data-action="import">Restore backup</button><button class="btn danger" data-action="reset">Erase this workspace</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><p class="notice">Your data is not shared with the creator or other testers. Anyone using this browser profile can access these entries, so avoid sensitive details on shared devices.</p>'+(loadFailure?'<p class="notice"><strong>Storage recovery:</strong> original data was damaged. <button class="btn" data-action="export-raw">Export untouched storage</button></p>':'')+'</section><section class="card wide"><h2>About the beta</h2><p>ATLAS Beta is an early test of a simpler everyday organiser. There are no payments, adverts, tracking or email sign-ups. Share feedback about what is useful, confusing or missing.</p><div class="settings-actions"><button class="btn" data-action="change-name">Change display name</button><button class="btn" data-action="feedback">Copy feedback questions</button></div></section></div>'}
function render(){if(loadFailure){$('workspace').hidden=true;$('bottom').hidden=true;$('welcome').hidden=false;$('welcome').innerHTML='<section class="welcome"><div class="kicker">ATLAS · STORAGE RECOVERY</div><h1>Keep your data safe.</h1><p>This browser has an unreadable saved workspace. Nothing has been overwritten.</p><div class="settings-actions"><button class="btn" data-action="export-raw">Download original storage</button><button class="btn danger" data-action="reset">Erase and start over</button></div><div class="privacy">Download your original storage before erasing it. Erasing cannot be undone.</div></section>';return}if(!data.name){$('workspace').hidden=true;$('bottom').hidden=true;$('welcome').hidden=false;$('welcome').innerHTML='<section class="welcome"><div class="kicker">ATLAS · FAMILY & FRIENDS BETA</div><h1>Make space<br>for life.</h1><p>Less clutter. More clarity. A simple place for your tasks, plans, notes and daily habits.</p><form id="welcomeForm"><div class="form-row"><label for="firstName">What should we call you?</label><input class="field" id="firstName" name="name" maxlength="40" autocomplete="given-name" placeholder="Your first name" required></div><button class="btn primary full" type="submit">Create my space →</button></form><div class="privacy">ⓘ No account needed. Your space is saved only in this browser, not shared with the ATLAS creator. It will not sync between devices.</div></section>';return}
$('welcome').hidden=true;$('workspace').hidden=false;$('bottom').hidden=false;
let content=({home,tasks,plan,notes,more})[view]();$('view').innerHTML=content;
const navigation=VIEWS.map(v=>'<button class="nav '+(view===v[0]?'active':'')+'" type="button" data-action="nav" data-view="'+v[0]+'" aria-current="'+(view===v[0]?'page':'false')+'"><span class="symbol" aria-hidden="true">'+v[1]+'</span><span>'+v[2]+'</span></button>').join('');
$('side').innerHTML=navigation;$('bottom').innerHTML=navigation;
}
function dialog(type,item){if(loadFailure){showToast('Recover your stored data before editing.');return}editing={type,id:item?.id||null};const names={tasks:'task',events:'plan',notes:'note',habits:'habit'};$('editorTitle').textContent=(item?'Edit ':'Add ')+names[type];const field=(name,label,value='',kind='text',required=true)=>'<div class="form-row"><label for="form-'+name+'">'+label+'</label><input class="field" id="form-'+name+'" name="'+name+'" type="'+kind+'" value="'+escapeHtml(value)+'" '+(required?'required':'')+' '+(kind==='text'?'maxlength="120"':'')+'></div>';
let content=field('title',type==='habits'?'Habit name':'Title',item?.title||'');
if(type==='tasks')content+=field('date','Due date (optional)',item?.due||'','date',false);
if(type==='events')content+=field('date','Date',item?.date||selected,'date')+field('time','Time (optional)',item?.time||'','time',false);
if(type==='notes')content+='<div class="form-row"><label for="form-body">Details</label><textarea class="field" id="form-body" name="body" maxlength="6000">'+escapeHtml(item?.body||'')+'</textarea></div>';
$('editorFields').innerHTML=content;$('editor').showModal();$('editorFields').querySelector('input')?.focus();
}
function writeRecord(type,values){const title=String(values.get('title')||'').trim();if(!title||title.length>120){showToast('Enter a shorter title.');return}let item=editing.id?data[type].find(x=>x.id===editing.id):null;if(!item&&data[type].length>=MAX[type]){showToast('This workspace is full. Remove older entries first.');return}
const next=item?{...item}:{id:uuid(),created:Date.now()};next.title=title;
if(type==='tasks'){const due=String(values.get('date')||'');if(due&&!dateValid(due)){showToast('Invalid date');return}next.due=due;next.done=!!item?.done}
if(type==='events'){const d=String(values.get('date')||'');if(!dateValid(d)){showToast('Choose a valid date.');return}next.date=d;next.time=String(values.get('time')||'')}
if(type==='notes')next.body=String(values.get('body')||'').slice(0,6000);
if(type==='habits')next.days=item?.days||[];
const before=JSON.stringify(data);if(item)Object.assign(item,next);else data[type].push(next);if(!save()){data=JSON.parse(before);return}$('editor').close();render();showToast(item?'Updated':'Added')}
function download(filename,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function actions(action,ref,el){if(action==='nav'){view=el.dataset.view;render();return}if(action.startsWith('new-')){dialog(action.slice(4));return}if(action.startsWith('edit-')){const type=action.slice(5),item=data[type]?.find(x=>x.id===ref);if(item)dialog(type,item);return}
if(action.startsWith('delete-')){const type=action.slice(7),item=data[type]?.find(x=>x.id===ref);if(!item||!confirm('Delete “'+item.title+'”?'))return;const before=JSON.stringify(data);data[type]=data[type].filter(x=>x.id!==ref);if(!save())data=JSON.parse(before);render();return}
if(action==='choose-day'){selected=el.dataset.date;render();return}if(action==='today'){selected=today();render();return}if(action==='prev-week'||action==='next-week'){selected=shift(selected,action==='next-week'?7:-7);render();return}
if(action==='export'){download('atlas-beta-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json');showToast('Backup downloaded. Keep it safe.');return}
if(action==='export-raw'){if(originalRaw!==null)download('atlas-beta-preserved.txt',originalRaw,'text/plain');return}
if(action==='import'){$('importFile').click();return}
if(action==='reset'){if(!confirm('Permanently delete your ATLAS Beta workspace on this browser? Export a backup first.'))return;if(!confirm('Final confirmation: erase all tasks, plans, notes and habits?'))return;try{localStorage.removeItem(KEY);originalRaw=null;loadFailure=false;data=initial();view='home';render()}catch(e){showToast('Could not erase browser data.')}return}
if(action==='change-name'){const n=prompt('Display name',data.name);if(n===null)return;const name=n.trim().slice(0,40);if(!name)return;const prev=data.name;data.name=name;if(!save())data.name=prev;render();return}
if(action==='feedback'){const text='ATLAS Beta feedback\\n1. What was easiest to use?\\n2. What was confusing?\\n3. What would make you open it every day?';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>showToast('Feedback questions copied.'),()=>showToast('Copy unavailable on this browser.'));else showToast('Copy unavailable on this browser.');return}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)actions(el.dataset.action,el.dataset.id||'',el)});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.check)return;if(loadFailure){el.checked=!el.checked;return}const type=el.dataset.check,item=data[type]?.find(x=>x.id===el.dataset.id);if(!item)return;const before=JSON.stringify(data);if(type==='tasks')item.done=el.checked;else if(type==='habits')item.days=el.checked?[...new Set([...item.days,today()])]:item.days.filter(d=>d!==today());if(!save())data=JSON.parse(before);render()});
$('editorForm').addEventListener('submit',e=>{e.preventDefault();if(!editing)return;writeRecord(editing.type,new FormData(e.target))});
$('cancelEditor').addEventListener('click',()=>$('editor').close());
document.addEventListener('submit',e=>{if(e.target.id!=='welcomeForm')return;e.preventDefault();if(loadFailure)return showToast('Preserve corrupted storage before starting.');const name=String(new FormData(e.target).get('name')||'').trim().slice(0,40);if(!name)return;data.name=name;if(!save())data.name='';render()});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>4000000)return showToast('Backup is too large.');try{const incoming=normalise(JSON.parse(await file.text()));if(!confirm('Replace all local beta data with this backup? Existing records will be overwritten.'))return;const prev=data,wasDamaged=loadFailure;loadFailure=false;data=incoming;if(!save()){data=prev;loadFailure=wasDamaged;return}originalRaw=localStorage.getItem(KEY);render();showToast('Backup restored.')}catch(err){showToast('Restore failed: '+err.message)}});
load();render();
})();
</script>
