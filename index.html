/* ATLAS Signature: deliberate hierarchy, restrained colour, no new dependencies */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;letter-spacing:-.008em}
.app-shell{isolation:isolate}

h1{font-weight:790;letter-spacing:-.055em}h2{font-weight:740;letter-spacing:-.032em}
.page-head h1{font-size:32px;margin:5px 0 3px}.sub{font-size:13px;line-height:1.5}

.fab{width:52px;height:52px;bottom:calc(88px + env(safe-area-inset-bottom));right:max(19px,calc((100vw - 560px)/2));border-radius:17px;border-color:var(--accent-text);box-shadow:0 7px 24px #0007}

.signature-home{max-width:590px}

.signature-next{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;gap:9px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent-text);border-radius:7px 17px 17px 7px;color:var(--text);padding:19px 18px;margin:8px 0 25px;min-height:112px}
.signature-next strong{font-size:20px;font-weight:730;letter-spacing:-.035em;line-height:1.2}

.signature-tasks{border-top:1px solid var(--border);border-bottom:1px solid var(--border);min-height:61px}
.signature-tasks .task:first-child{padding-top:14px}.signature-tasks>.fine{padding:20px 0}
.signature-capture{margin:25px 0 28px}

.library-icon{display:grid;place-items:center;width:43px;height:43px;flex:none;border-radius:12px;background:var(--surface2);color:var(--accent-text)}
.library-icon svg{width:21px;height:21px}

.library-copy strong{font-size:15px;font-weight:720}.library-copy small{color:var(--muted);font-size:11px}
.library-count{color:var(--muted);font-variant-numeric:tabular-nums}

.signature-quick-sheet h2{font-size:23px;margin:5px 0}
.signature-quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
.signature-option{display:flex;flex-direction:column;align-items:flex-start;gap:9px;min-height:128px;text-align:left;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:15px}
.signature-option svg{width:24px;height:24px;color:var(--accent-text)}
.signature-option strong{font-size:15px}.signature-option small{font-size:11px;color:var(--muted)}
.signature-inbox{display:flex;justify-content:space-between;width:100%;padding:14px 4px;background:transparent;border:0;border-top:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700}
button:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
@media(max-width:360px){.content{padding-left:16px;padding-right:16px}.signature-library-row{gap:9px}.signature-next{padding:15px}.signature-hero h1{font-size:29px}}
@media(orientation:landscape) and (min-width:620px){.topbar{min-height:49px;padding-top:5px;padding-bottom:5px}.content{padding:14px 24px 24px}.bottomnav{padding:10px 4px 10px max(4px,env(safe-area-inset-left));border-right:1px solid var(--border);border-top:0}.bottomnav button{min-height:54px}.fab{bottom:max(17px,env(safe-area-inset-bottom));right:max(18px,env(safe-area-inset-right));width:46px;height:46px}.signature-hero h1{font-size:30px}.signature-next{min-height:86px;padding:14px 18px;margin-bottom:16px}.signature-library h1{font-size:32px}.signature-library-row{min-height:60px}.signature-quick-sheet{max-height:calc(100dvh - 12px);overflow:auto}}
@media(prefers-reduced-motion:reduce){.signature-option,.signature-library-row{transition:none!important}}

.signature-kicker i{background:#f38da1;box-shadow:0 0 12px #b72b55}
.signature-next{position:relative;isolation:isolate;overflow:hidden;border:1px solid #6e3546;border-left:3px solid #f07992;border-radius:8px 20px 20px 8px;background:linear-gradient(115deg,#3a1a2a 0%,#20131d 65%,#170f16 100%);box-shadow:inset 0 1px #ffffff18,0 18px 35px #0000002d;padding:21px 19px}
.signature-next:after{content:"";position:absolute;pointer-events:none;right:-64px;top:-94px;width:205px;height:205px;border-radius:50%;border:1px solid #f39bab2d;box-shadow:0 0 0 22px #ed79900a,0 0 0 43px #ed799007;z-index:-1}
.signature-next strong{font-weight:760;font-size:21px;letter-spacing:-.04em}
.signature-next small{color:#dbc1c9}
.signature-clear{border-left-color:#704454;background:linear-gradient(120deg,#24171f,#170f16)}
.signature-heading h2,.section-head h2{font-weight:760;letter-spacing:-.04em}
.signature-heading>button{color:#ff9aaa}
.card,.project,.note,.tile,.signature-links button,.signature-option{background:linear-gradient(155deg,#1f141c 0%,#171016 85%);border:1px solid #49303b;border-radius:18px;box-shadow:inset 0 1px #ffffff08}
.card-accent{background:linear-gradient(120deg,#311724,#191018);border-left:3px solid #c4556b}
.card-head{color:#ffa1ad}
.project-icon,.library-icon{background:linear-gradient(145deg,#421b2c,#261522);border-color:#753b4d;color:#ff9aaa}
.signature-library-row{border-bottom-color:#49303b;transition:padding .18s ease,background .18s ease}
.signature-library-row:active{background:#40233155;padding-left:10px}
.signature-links button{min-height:102px;gap:9px}
.signature-links button svg,.signature-option svg{color:#f98fa3}
.signature-tasks{border-color:#51333d}
.task{border-top-color:#42303a}.tasktitle{font-weight:670}
.check{border-color:#a07e8a}.check:checked{background:#7ddca9;border-color:#7ddca9}
.pill{border-color:#593944;background:#24171f}
.action:not(.ghost):not(.line){background:linear-gradient(140deg,#b43953,#922238);border-color:#cb6176;box-shadow:inset 0 1px #ffffff20}
.action.ghost{border-color:var(--border);background:#2a1a23}
.fab{background:linear-gradient(140deg,#d45268,#8f1d37);border-color:#e77d90;box-shadow:0 10px 28px #0008,0 0 25px #99294333;border-radius:19px}
.progress>span{background:linear-gradient(90deg,#9e2c46,#f17e91)}
.bottomnav{background:#100c11ed;border-top-color:#543340;gap:6px;box-shadow:0 -14px 28px #00000028}
.bottomnav button{position:relative;border-radius:12px;color:#c7aeb7;font-weight:680}
.bottomnav button.active{background:linear-gradient(165deg,#4c2030,#2e1722);color:#fff6f4}
.bottomnav button.active:before{content:"";position:absolute;top:1px;left:30%;right:30%;height:2px;border-radius:0 0 5px 5px;background:#ff96a4}
.bottomnav button.active .navicon{color:#ff9aaa}
.sheet{background:linear-gradient(180deg,#21141e,#130e14 65%);border-color:#6a3b4b;box-shadow:0 -20px 80px #000a}
.sheet .titlebar h2{font-weight:760}
.cal-views button{background:#1c131b;border-color:#4b303b}
.cal-views button.active{background:linear-gradient(140deg,#58283b,#321923);border-color:#c0677e;color:#fff6f4}
.cal-week-scroller,.cal-month-cell{border-color:#4b333e}
.cal-current-line{background:#ff96a4}
.calendar-tools-panel{background:#1b121a;border-color:#684052;box-shadow:0 18px 48px #0008}
:where(.card,.tile,.note,.project,.signature-next,.signature-links button,.signature-option):focus-visible{outline:2px solid #ff9aaa;outline-offset:3px}
@media(max-width:360px){.signature-hero:before{width:100px;height:100px;right:-7px;top:5px}.signature-next{padding:17px 15px}.topbar{padding-left:16px;padding-right:16px}}
@media(orientation:landscape) and (min-width:620px){.app-shell{background:radial-gradient(ellipse 360px 360px at 14% 0,#60243822,transparent 80%),var(--bg)}.topbar{padding-top:4px;padding-bottom:4px}.mark{width:32px;height:32px}.signature-hero{padding:0 0 10px}.signature-hero:before{width:105px;height:105px}.signature-next{padding:15px 18px}.bottomnav{border-top:0;border-right:1px solid #543340}.bottomnav button.active:before{top:15%;bottom:15%;left:0;right:auto;width:2px;height:auto;border-radius:0 5px 5px 0}}
@media(prefers-reduced-motion:reduce){.iconbtn,.signature-library-row{transition:none!important}}

html,body{background:var(--bg);color:var(--text)}
body{background:radial-gradient(ellipse 80% 26% at 50% -9%,var(--mat-veil),transparent),var(--bg)}
.app-shell{background-image:var(--matte),radial-gradient(ellipse 90% 340px at 90% 0%,var(--mat-veil),transparent 80%),linear-gradient(180deg,var(--surface),var(--bg) 42%);background-size:128px 128px,auto,auto;background-repeat:repeat,no-repeat,no-repeat}
.topbar{border-bottom:1px solid var(--mat-line);background:linear-gradient(180deg,var(--mat-glint),transparent);padding-top:16px}
.brand b{font-size:19px;font-weight:770;letter-spacing:.23em}
.brand small{color:var(--muted);letter-spacing:.2em}
.mark{background:linear-gradient(140deg,var(--mat-tint),var(--surface));border-color:var(--border);box-shadow:inset 0 1px var(--mat-glint),0 7px 20px #0003}
.mark svg{display:block;width:100%;height:100%}
.iconbtn{background:linear-gradient(155deg,var(--surface2),var(--surface));border:1px solid var(--mat-line);box-shadow:inset 0 1px var(--mat-glint)}
.syncbar{color:var(--muted);opacity:.95}
.signature-hero{padding:11px 0 20px}
.signature-hero h1{font-weight:750;line-height:1.08;letter-spacing:-.065em;text-wrap:balance}
.signature-hero:before{width:116px;height:116px;right:0;top:4px;opacity:.52;border-color:var(--mat-line);box-shadow:0 0 0 22px var(--mat-veil),0 0 0 43px color-mix(in srgb,var(--accent) 7%,transparent)}
.signature-next{position:relative;background-image:var(--matte),radial-gradient(ellipse at 104% -65%,var(--mat-veil),transparent 65%),linear-gradient(120deg,var(--mat-tint),var(--surface) 86%);background-size:128px 128px,auto,auto;background-repeat:repeat,no-repeat,no-repeat;border:1px solid var(--border);border-left:3px solid var(--accent-text);border-radius:8px 19px 19px 8px;box-shadow:inset 0 1px var(--mat-glint),0 12px 26px #0004;padding:20px 19px}
.signature-next:before{content:"";position:absolute;top:0;left:10px;right:15px;height:1px;background:linear-gradient(90deg,var(--mat-glint),transparent)}
.signature-next:after{width:198px;height:198px;top:-98px;right:-60px;opacity:.35;border-color:var(--mat-line);box-shadow:0 0 0 22px var(--mat-veil),0 0 0 43px color-mix(in srgb,var(--accent) 6%,transparent)}
.signature-next strong{font-size:21px;font-weight:740;letter-spacing:-.035em}
.signature-next small{color:var(--muted)}
.signature-clear{background-image:var(--matte),linear-gradient(120deg,var(--surface2),var(--surface));background-size:128px 128px,auto;background-repeat:repeat,no-repeat}
.section-head h2,.signature-heading h2{font-weight:750;letter-spacing:-.04em}
.card,.project,.note,.tile,.signature-links button,.signature-option{background-image:var(--matte),linear-gradient(155deg,color-mix(in srgb,var(--surface) 94%,var(--surface2) 6%),var(--surface));background-size:128px 128px,auto;background-repeat:repeat,no-repeat;border:1px solid var(--mat-line);box-shadow:inset 0 1px var(--mat-glint),0 3px 14px #0002}
.card-accent{background-image:var(--matte),linear-gradient(120deg,var(--mat-tint),var(--surface));background-size:128px 128px,auto;background-repeat:repeat,no-repeat;border-left:3px solid var(--accent-text)}
.signature-links button{min-height:102px}
.project-icon,.library-icon{background:linear-gradient(145deg,var(--mat-tint),var(--surface2));border-color:var(--mat-line)}
.signature-tasks,.task,.signature-library-row{border-color:var(--mat-line)}
.action:not(.ghost):not(.line){background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 76%,var(--text) 24%),var(--accent));border-color:var(--accent);box-shadow:inset 0 1px var(--mat-glint),0 5px 12px #0003}
.action.ghost,.micro{background:var(--surface2);border-color:var(--mat-line)}
.input,.select,.textarea,.capture input{background:var(--surface);border-color:var(--border)}
.bottomnav{background-image:var(--matte),linear-gradient(180deg,var(--surface2),var(--surface));background-size:128px 128px,auto;background-repeat:repeat,no-repeat;border-top:1px solid var(--mat-line);box-shadow:inset 0 1px var(--mat-glint),0 -12px 25px #0003}
.bottomnav button{color:var(--muted)}
.bottomnav button.active{background:linear-gradient(150deg,var(--mat-tint),var(--surface2));border:1px solid var(--mat-line);box-shadow:inset 0 1px var(--mat-glint);color:var(--text)}
.bottomnav button.active:before{background:var(--accent-text)}
.bottomnav button.active .navicon{color:var(--accent-text)}
.fab{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 70%,var(--text) 30%),var(--accent));border-color:var(--accent-text);box-shadow:inset 0 1px var(--mat-glint),0 8px 22px #0006}
.sheet{background-image:var(--matte),linear-gradient(150deg,var(--surface2),var(--surface));background-size:128px 128px,auto;background-repeat:repeat,no-repeat;border-color:var(--mat-line)}
.cal-views button{background:linear-gradient(150deg,var(--surface2),var(--surface));color:var(--muted);border-color:var(--mat-line)}
.cal-views button.active{background:linear-gradient(150deg,var(--mat-tint),var(--surface2));color:var(--text);border-color:var(--accent-text);box-shadow:inset 0 1px var(--mat-glint)}
.cal-period button,.cal-portrait-day-head>button{border-color:var(--mat-line)}
.cal-portrait-date-strip{background-image:var(--matte),linear-gradient(150deg,var(--surface2),var(--surface));background-size:128px 128px,auto;background-repeat:repeat,no-repeat;border-color:var(--mat-line)}
.cal-portrait-date.is-selected{background:var(--mat-tint);color:var(--text);border-color:var(--accent-text)}
.cal-portrait-date.is-selected strong{background:var(--accent);color:var(--accent-on)}
.cal-month-cell{border-color:var(--mat-line)}
.calendar-tools-panel{background:var(--surface2);border-color:var(--mat-line)}
.capture-voice{min-height:46px;min-width:46px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--accent-text);font-size:21px}
.voice-sheet .textarea{min-height:110px}
.voice-sheet .field{margin:12px 0}
.voice-actions{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}
.voice-actions button{min-height:44px}
.voice-status{min-height:20px;color:var(--accent-text);font-size:12px}
.voice-note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:14px}
@media(max-width:360px){.signature-next{padding:17px 15px}}
@media(orientation:landscape) and (min-width:620px){.app-shell{background-image:var(--matte),radial-gradient(ellipse 340px 330px at 16% 0,var(--mat-veil),transparent 80%),linear-gradient(180deg,var(--surface),var(--bg));background-size:128px 128px,auto,auto;background-repeat:repeat,no-repeat,no-repeat}.bottomnav{border-top:0;border-right:1px solid var(--mat-line)}}
@media(prefers-reduced-motion:reduce){.capture-voice,.signature-next,.bottomnav button{transition:none!important}}
:root[data-atlas-theme="arctic"] .bottomnav{box-shadow:0 -7px 20px #24385412}
:root[data-atlas-theme="arctic"] .signature-hero:before{opacity:.27}


/* ATLAS RESPONSIVE COMPOSITION 04 — responsive hierarchy, accessible material */
:root{--atlas-content-max:1340px;--atlas-column-gap:clamp(18px,2.4vw,34px)}
.ui-icon{width:21px;height:21px;stroke-width:1.9;overflow:visible}
.top-actions .ui-icon{width:20px;height:20px}
.signature-links .ui-icon,.signature-library .ui-icon{stroke-width:1.85}
.capture-voice{display:inline-grid;place-items:center;flex:0 0 46px;min-height:46px;padding:9px}
.capture-voice .ui-icon{width:20px;height:20px}
.signature-inbox .ui-icon{width:17px;height:17px;margin-right:8px;vertical-align:middle}
.signature-workspace{min-width:0}
.signature-primary,.signature-secondary{min-width:0}
.signature-primary .signature-next{width:100%;margin-top:8px}
.signature-secondary .signature-capture{margin-top:26px}
.signature-secondary .signature-links button{min-height:104px}
.signature-secondary .signature-capture .capture{align-items:stretch}
.signature-secondary .capture>input{min-width:0}
.signature-home,.signature-library{width:100%;max-width:640px;margin-inline:auto}
.signature-library-list{min-width:0}
.signature-library-row{min-width:0}
.signature-library-row:focus-visible,.signature-links button:focus-visible,.capture-voice:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
.signature-library-row,.signature-next,.signature-links button{transition:border-color .16s ease,background-color .16s ease,transform .16s ease}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
 .signature-links button:hover,.signature-library-row:hover{transform:translateY(-1px)}
 .signature-next:hover{border-color:var(--accent-text)}
}
@media(min-width:740px) and (orientation:portrait){
 .app-shell{max-width:min(100%,940px)}
 .content{padding-inline:clamp(24px,4vw,48px)}
 .signature-home,.signature-library{max-width:770px}
 .signature-links{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
 .signature-next{min-height:128px}
 .signature-hero h1{font-size:clamp(36px,4vw,48px)}
}
@media(min-width:1000px) and (min-height:590px){
 .app-shell{--atlas-content-max:1340px}
 .content{width:100%;max-width:var(--atlas-content-max);margin-inline:auto;padding:clamp(24px,3vw,42px) clamp(28px,4vw,58px) 44px}

/* Appearance Studio 01 — adjustable visual density, corners and grain, mobile-safe. */

/* Explicit motion reduction adds to (never overrides) the device accessibility preference. */

/* Visual clarity: restrained grouped library, compact task states and tactile feedback. */
.signature-library-sections{display:grid;gap:24px}

@media(max-width:360px){.atlas-task-card{padding:9px 10px}.atlas-task-card .task{gap:7px}.atlas-task-card .taskactions{gap:2px}.atlas-task-card .taskactions .micro{min-width:42px}.atlas-task-card .check{width:30px;min-width:30px;height:30px}}

:root[data-atlas-text-size="large"] :is(.tasktitle,.library-copy strong,.note-preview,.signature-next small,.signature-home-note,.sub,.fine){font-size:16px;line-height:1.65}

  .sort((a,b)=>atlasDayIndex(a.startDate)-atlasDayIndex(b.startDate)||a.startTime.localeCompare(b.startTime)||a.title.localeCompare(b.title));

function insBuckets(range){let step=range.days<=35?1:range.days<=125?7:30;let start=range.start;const result=[];for(let i=0;start<=range.end&&i<80;i++){let end=dateAdd(start,step-1);if(end>range.end)end=range.end;result.push({start,end,label:step===1?start.slice(8):step===7?`${+start.slice(8)}/${+start.slice(5,7)}`:start.slice(0,7)});start=dateAdd(end,1)}return result;}
function insSeries(buckets,records,field,filter){return buckets.map(b=>records.filter(x=>x.date>=b.start&&x.date<=b.end&&(!filter||filter(x))).reduce((s,x)=>s+(Number(x[field])||0),0));}
function insBarChart(title,buckets,series,{unit='',empty='No dated records for this period.',source='Manual ATLAS records',metric=''}={}){
 const max=Math.max(0,...series.flatMap(s=>s.values)),has=series.some(s=>s.values.some(v=>v>0));if(!has)return `<div class="ins-visual-empty"><b>${esc(title)}</b><p>${esc(empty)}</p><small>Source: ${esc(source)}</small></div>`;
 const width=720,height=228,plotBottom=183,plotTop=19,plotHeight=plotBottom-plotTop,left=35,usable=width-left-12,n=buckets.length,group=usable/n,barW=Math.max(2,Math.min(15,(group-3)/series.length-1));
 const moneyText=n=>unit==='£'?insMoney(n):unit==='h'?`${insFloat(n)}h`:Math.round(n).toLocaleString('en-GB');
 const grid=[0,.25,.5,.75,1].map(f=>{let y=plotBottom-f*plotHeight;return `<line x1="${left}" x2="${width-5}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${left-5}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(moneyText(max*f))}</text>`}).join('');
 const bars=buckets.map((b,i)=>series.map((s,j)=>{const val=s.values[i]||0,barHeight=val/max*plotHeight,cx=left+group*(i+.5),x=cx-series.length*barW/2+j*barW+1;return `<rect x="${x.toFixed(1)}" y="${(plotBottom-barHeight).toFixed(1)}" width="${Math.max(1,barW-2).toFixed(1)}" height="${Math.max(0,barHeight).toFixed(1)}" rx="2" fill="${s.color}" opacity=".94"><title>${esc(b.start)}–${esc(b.end)}: ${esc(s.name)} ${esc(moneyText(val))}</title></rect>`}).join('')).join('');
 const tickEvery=Math.max(1,Math.ceil(n/7));const ticks=buckets.map((b,i)=>i%tickEvery===0||i===n-1?`<text x="${(left+group*(i+.5)).toFixed(1)}" y="203" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(b.label)}</text>`:'').join('');
 const accessible=series.map(s=>`${s.name}: ${moneyText(insSum(s.values))}`).join('; ');
 return `<div class="ins-chart"><div class="ins-chart-head"><h3>${esc(title)}</h3><span>${esc(source)}</span></div><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(title+'. '+accessible)}" preserveAspectRatio="xMidYMid meet">${grid}${bars}${ticks}</svg><div class="ins-chart-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>${metric?`<div class="ins-bucket-scroll" role="group" aria-label="Explore graph values">${buckets.map((b,i)=>`<button class="ins-bucket" data-action="ins-drill" data-metric="${esc(metric)}" data-start="${b.start}" data-end="${b.end}" title="Inspect source records"><b>${esc(b.label)}</b><small>${esc(series.map(s=>s.name+' '+moneyText(s.values[i]||0)).join(' · '))}</small></button>`).join('')}</div>`:''}</div>`;
}
const insMetric=(label,value,description='',accent=false)=>`<div class="ins-metric ${accent?'ins-metric-red':''}"><small>${esc(label)}</small><strong>${esc(value)}</strong><span>${esc(description)}</span></div>`;
const insNoData=(message)=>`<div class="ins-empty"><span>◈</span><p>${esc(message)}</p></div>`;
function insSummary(range){const tx=insEntries(data.transactions,range),logs=insEntries(data.timeEntries,range),completed=data.tasks.filter(t=>t.done&&insIn(insLondonDate(t.completedAt),range));return {tx,income:insSum(tx.filter(t=>t.kind==='income'),'amount'),spend:insSum(tx.filter(t=>t.kind==='expense'),'amount'),logs,minutes:insSum(logs,'minutes'),completed,overdue:openTasks().filter(t=>t.due&&t.due<insToday())};}
function insHeader(){const range=insPeriodDates();return `<div class="eyebrow">LOCAL ANALYTICS · NO TRACKING</div><div class="page-head"><div><h1>Insights</h1><p class="sub">What your own records actually show.</p></div>${btn('Data settings','settings','','action ghost small')}</div><div class="ins-range" role="group" aria-label="Analytics date range">${[['7','7D'],['30','30D'],['90','90D'],['365','1Y'],['custom','Custom']].map(([v,label])=>`<button data-action="ins-period" data-period="${v}" ${insPeriod===v?'aria-pressed="true" class="selected"':''}>${label}</button>`).join('')}</div>${insPeriod==='custom'?`<div class="ins-custom"><label>From <input id="ins-start" type="date" value="${esc(insCustomStart)}"></label><label>To <input id="ins-end" type="date" value="${esc(insCustomEnd)}"></label></div>${!range.valid?'<p role="alert" class="ins-warning">Choose a valid range of up to two years.</p>':''}`:''}<p class="ins-period-label">${esc(calFormatDate(range.start,{day:'numeric',month:'short',year:'numeric'}))} – ${esc(calFormatDate(range.end,{day:'numeric',month:'short',year:'numeric'}))} · Europe/London</p><div class="ins-tabs" role="group" aria-label="Insight sections">${[['overview','Overview'],['money','Money'],['tasks','Tasks'],['time','Time'],['habits','Habits'],['goals','Goals']].map(([v,label])=>`<button data-action="ins-tab" data-tab="${v}" ${insTab===v?'aria-pressed="true" class="active"':''}>${label}</button>`).join('')}</div>`;}
function insOverview(r){const s=insSummary(r),all=data.tasks.length,com=data.tasks.filter(t=>t.done).length;return `<div class="ins-metrics">${insMetric('Recorded income',insMoney(s.income),'Only entered transactions',true)}${insMetric('Recorded spending',insMoney(s.spend),'Only entered transactions')}${insMetric('Tasks completed',String(s.completed.length),'With completion timestamps')}${insMetric('Time logged',insMinute(s.minutes),'Actual time entered manually')}</div><div class="ins-notice">Amounts, completion dates and time logs are not connected to your bank or device activity. An empty chart means no recorded data—not zero activity.</div>${insCashChart(r)}${insTaskChart(r)}<div class="ins-two">${insProjects()}${insGoalsCompact()}</div><div class="ins-footer">${btn('＋ Record money','ins-new',`data-kind="transaction"`,'action small')}${btn('＋ Log time','ins-new',`data-kind="time"`,'action ghost small')}${btn('＋ Track a habit','ins-new',`data-kind="habit"`,'action ghost small')}</div>`;}
function insCashChart(r){const tx=insEntries(data.transactions,r),b=insBuckets(r);return insBarChart('Cashflow · recorded transactions',b,[{name:'Income',values:insSeries(b,tx,'amount',t=>t.kind==='income'),color:'#80b9a2'},{name:'Spending',values:insSeries(b,tx,'amount',t=>t.kind==='expense'),color:'#d8767f'}],{unit:'£',source:'Entered income & expense entries',metric:'transactions',empty:'No income or spending transactions have been entered for this period.'});}
function insTaskChart(r){const tasks=data.tasks.map(t=>({...t,_doneDate:insLondonDate(t.completedAt),_created:t.createdAtInferred?'':insLondonDate(t.createdAt)})),b=insBuckets(r);const done=tasks.filter(t=>t.done&&insIn(t._doneDate,r)),created=tasks.filter(t=>insIn(t._created,r));return insBarChart('Task activity',b,[{name:'Completed',values:insSeries(b,done.map(t=>({...t,date:t._doneDate,count:1})),'count'),color:'#80b9a2'},{name:'Created',values:insSeries(b,created.map(t=>({...t,date:t._created,count:1})),'count'),color:'#d8767f'}],{source:'Task timestamps stored in ATLAS',metric:'tasks',empty:'No tasks with dated creation or completion records in this period.'});}
function insProjects(){const projects=data.projects.map(p=>{const linked=data.tasks.filter(t=>t.projectId===p.id),done=linked.filter(t=>t.done).length;return {p,total:linked.length,done}}).sort((a,b)=>(b.total-a.total)).slice(0,8);return `<div class="card ins-panel"><h3>Project progress</h3>${projects.length?projects.map(({p,total,done})=>`<div class="ins-progress-row"><div><b>${esc(p.title)}</b><small>${done}/${total} linked tasks · ${esc(p.status||'active')}</small></div><div class="ins-track"><span style="width:${total?done/total*100:0}%"></span></div></div>`).join(''):insNoData('No projects recorded yet.')}<small class="ins-source">Source: linked tasks; project status does not imply completion.</small></div>`;}
function insGoalsCompact(){return `<div class="card ins-panel"><h3>Goal progress</h3>${data.goals.length?data.goals.slice(0,8).map(g=>`<div class="ins-progress-row"><div><b>${esc(g.title)}</b><small>${esc(String(g.current??0))} / ${esc(String(g.target))} ${esc(g.unit||'')}</small></div><div class="ins-track"><span style="width:${goalPct(g)}%"></span></div></div>`).join(''):insNoData('Add a goal to see meaningful progress.')}<small class="ins-source">Source: current goal values; no historical trend unless edits have been logged.</small></div>`;}
function insTransactionRows(r){return [...insEntries(data.transactions,r)].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(t=>`<div class="ins-record"><div><b>${esc(t.title)}</b><small>${esc(t.date)} · ${esc(INS_CATS[t.category]||'Other')}</small></div><strong class="${t.kind==='expense'?'ins-out':'ins-in'}">${t.kind==='expense'?'-':'+'}${insMoney(t.amount)}</strong><button class="ins-delete" data-action="ins-delete" data-kind="transaction" data-id="${esc(t.id)}" aria-label="Delete transaction ${esc(t.title)}">×</button></div>`).join('')||insNoData('Nothing recorded here yet.');}
function insMoneyPanel(r){const s=insSummary(r),debts=data.money.filter(x=>!x.paid),due=insSum(debts,'amount'),income=s.income,spend=s.spend;const cats={};for(const t of s.tx.filter(x=>x.kind==='expense'))cats[t.category]=(cats[t.category]||0)+t.amount;return `<div class="ins-metrics">${insMetric('Income entered',insMoney(income),'Manual ledger',true)}${insMetric('Expenses entered',insMoney(spend),'Manual ledger')}${insMetric('Net recorded flow',insMoney(income-spend),'Income minus expenses')}${insMetric('Unpaid commitments',insMoney(due),'Across all dates')}</div><div class="ins-notice"><b>Two different numbers:</b> transactions are money already received/spent. Bills and debts are planned obligations. ATLAS never double-counts a paid bill as an expense unless you log the transaction yourself.</div>${insCashChart(r)}<div class="ins-two"><div class="card ins-panel"><h3>Spending breakdown</h3>${insCategoryBreakdown(cats,insSum(Object.values(cats)),INS_CATS)}<small class="ins-source">Recorded expenses only · ${esc(r.start)} to ${esc(r.end)}</small></div><div class="card ins-panel"><h3>Balance & obligations</h3>${insMetric('Last manual balance',data.balance===null?'Not entered':insMoney(data.balance),'Snapshot, not bank sync')}${insMetric('Total unpaid',insMoney(totalUnpaid()),'Current bills & debts')}${insMetric('After commitments',data.balance===null?'Unknown':insMoney(data.balance-totalUnpaid()),'Estimate only')}</div></div>${insBalanceChart(r)}<div class="ins-panel card"><div class="between"><h3>Transaction ledger</h3>${btn('＋ Transaction','ins-new',`data-kind="transaction"`,'action small')}</div><p class="fine">Only transactions you add are included in income and spending charts.</p>${insTransactionRows(r)}</div>`;}
function insCategoryBreakdown(obj,total,labels){const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]);return entries.length?entries.map(([k,v],i)=>`<div class="ins-breakdown"><div><b>${esc(labels[k]||k)}</b><span>${total?(v/total*100).toFixed(0):0}% · ${insMoney(v)}</span></div><div class="ins-track"><span style="width:${total?v/total*100:0}%;background:${INS_PALETTE[i%INS_PALETTE.length]}"></span></div></div>`).join(''):insNoData('No spending categories to analyse yet.');}
function insBalanceChart(r){const logs=insEntries(data.balanceHistory,r),b=insBuckets(r);return insBarChart('Manual balance snapshots',b,[{name:'Recorded balance',values:b.map(bucket=>{const l=logs.filter(x=>x.date>=bucket.start&&x.date<=bucket.end).sort((a,b)=>b.createdAt-a.createdAt)[0];return l?l.value:0}),color:'#80b9a2'}],{unit:'£',source:'Snapshots you manually set',metric:'balance',empty:'No balance edits recorded in this period. Older balances cannot be reconstructed.'});}
function insTasksPanel(r){const s=insSummary(r),created=data.tasks.filter(t=>!t.createdAtInferred&&insIn(insLondonDate(t.createdAt),r)),doneIn=s.completed;const unknown=data.tasks.filter(t=>t.done&&!t.completedAt).length,undatedCreated=data.tasks.filter(t=>t.createdAtInferred).length;return `<div class="ins-metrics">${insMetric('Completed',String(doneIn.length),'Dated completion records',true)}${insMetric('Created',String(created.length),'Task creation dates')}${insMetric('Open',String(openTasks().length),'Current total')}${insMetric('Overdue',String(s.overdue.length),'Open, due before today')}</div>${insTaskChart(r)}${unknown||undatedCreated?`<p class="ins-warning">${unknown} completed task(s) lack a completion timestamp; ${undatedCreated} task(s) have an inferred creation timestamp. These are excluded from the respective historical series.</p>`:''}<div class="ins-two">${insProjects()}<div class="card ins-panel"><h3>Open task priorities</h3>${[['high','High'],['normal','Normal'],['low','Low']].map(([k,label])=>{const arr=openTasks().filter(t=>t.priority===k);return `<div class="ins-record"><b>${label}</b><strong>${arr.length}</strong></div>`}).join('')}<p class="fine">These are current totals, not historical trends.</p>${btn('Manage tasks','goto-today','','action small')}</div></div>`;}
function insTimePanel(r){const logs=insEntries(data.timeEntries,r),total=insSum(logs,'minutes'),cat={};for(const t of logs)cat[t.category]=(cat[t.category]||0)+t.minutes;const b=insBuckets(r);const validDays=Math.min(r.days,730);let events=[];if(validDays<=400)events=calOccurrences(r.start,r.end).filter(o=>o.kind!=='deadline'&&!o.allDay&&!o.dstGap);const actual=logs.map(t=>({...t,hours:t.minutes/60}));return `<div class="ins-metrics">${insMetric('Logged time',insMinute(total),'Actually recorded',true)}${insMetric('Sessions',String(logs.length),'Manual logs')}${insMetric('Scheduled hours',insMinute(insSum(events,'durationMins')),'Calendar estimates, not actual')}${insMetric('Days with logs',String(new Set(logs.map(l=>l.date)).size),'During selected period')}</div>${insBarChart('Recorded time',b,[{name:'Logged hours',values:insSeries(b,actual,'hours'),color:'#80b9a2'}],{unit:'h',source:'Manual time logs only',metric:'time',empty:'No time logs in this period. Calendar blocks are plans, not proof of time spent.'})}<div class="ins-two"><div class="card ins-panel"><h3>Where logged time went</h3>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<div class="ins-breakdown"><div><b>${esc(INS_TIME_CATS[k]||k)}</b><span>${insMinute(v)} · ${total?Math.round(v/total*100):0}%</span></div><div class="ins-track"><span style="width:${total?v/total*100:0}%;background:${INS_PALETTE[i%INS_PALETTE.length]}"></span></div></div>`).join('')||insNoData('Start logging activities to see this breakdown.')}</div><div class="card ins-panel"><h3>Log an activity</h3><p class="fine">Use 5 seconds to record the time you actually spent. Work and rest are never inferred from your calendar.</p>${btn('＋ Log time','ins-new',`data-kind="time"`,'action small')}${logs.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(t=>`<div class="ins-record"><div><b>${esc(t.title)}</b><small>${esc(t.date)} · ${esc(INS_TIME_CATS[t.category])}</small></div><strong>${insMinute(t.minutes)}</strong><button class="ins-delete" data-action="ins-delete" data-kind="time" data-id="${esc(t.id)}" aria-label="Delete time log">×</button></div>`).join('')}</div></div>`;}
function insHabitCount(h,r){return data.habitLogs.filter(c=>c.habitId===h.id&&insIn(c.date,r)).length;}
function insHabitPanel(r){const all=data.habits.filter(h=>!h.archived),thisWeek={start:calStartWeek(insToday()),end:insToday()},today=insToday(),logs=insEntries(data.habitLogs,r);const b=insBuckets(r);return `<div class="ins-metrics">${insMetric('Habits tracked',String(all.length),'Active habits',true)}${insMetric('Check-ins',String(logs.length),'During selected period')}${insMetric('Today',String(logs.filter(c=>c.date===today).length),'Completions today')}${insMetric('Days recorded',String(new Set(logs.map(c=>c.date)).size),'With at least one check-in')}</div>${insBarChart('Habit check-ins',b,[{name:'Checks',values:insSeries(b,logs.map(x=>({...x,count:1})),'count'),color:'#80b9a2'}],{source:'Dated check-ins',metric:'habits',empty:'No habit check-ins in this period.'})}<div class="card ins-panel"><div class="between"><h3>Your habits</h3>${btn('＋ Habit','ins-new',`data-kind="habit"`,'action small')}</div><p class="fine">Tap a habit to log or remove today's check-in. A weekly goal is a target, not proof you completed it on missing days.</p>${all.length?all.map(h=>{const checked=data.habitLogs.some(l=>l.habitId===h.id&&l.date===today),weekCount=insHabitCount(h,thisWeek),periodCount=insHabitCount(h,r);return `<div class="ins-habit-row"><button class="ins-habit-check ${checked?'checked':''}" data-action="ins-habit-check" data-id="${esc(h.id)}" aria-pressed="${checked}" title="Toggle today"><span>${checked?'✓':'＋'}</span></button><div><b>${esc(h.title)}</b><small>${weekCount}/${h.targetPerWeek} this week · ${periodCount} in range</small><div class="ins-track"><span style="width:${Math.min(100,100*weekCount/h.targetPerWeek)}%"></span></div></div><button class="ins-delete" data-action="ins-delete" data-kind="habit" data-id="${esc(h.id)}" aria-label="Delete habit">×</button></div>`}).join(''):insNoData('Create a habit and check in once each day.')}</div>`;}
function insGoalPanel(r){const histories=data.goalHistory.filter(g=>insIn(g.date,r));let body='';for(const g of data.goals){const logs=histories.filter(x=>x.goalId===g.id).sort((a,b)=>a.date.localeCompare(b.date)),b=insBuckets(r);body+=`<div class="card ins-panel"><div class="between"><div><h3>${esc(g.title)}</h3><p class="fine">${esc(String(g.current))} / ${esc(String(g.target))} ${esc(g.unit||'')} · ${goalPct(g)}%</p></div>${btn('Edit goal','edit',`data-type="goal" data-id="${esc(g.id)}"`,'action ghost small')}</div><div class="ins-track big"><span style="width:${goalPct(g)}%"></span></div>${insBarChart('Recorded goal changes',b,[{name:'Recorded value',values:b.map(bucket=>{let log=logs.filter(x=>x.date>=bucket.start&&x.date<=bucket.end).sort((a,b)=>b.createdAt-a.createdAt)[0];return log?log.value:0}),color:'#80b9a2'}],{source:'Saved goal edits',empty:'No dated progress changes for this goal in this period.'})}</div>`}return `${insMetric('Goals',String(data.goals.length),'Manually tracked')}${body||insNoData('No goals in ATLAS yet.')}<p class="ins-notice">Changes are recorded from this version onwards. Zero-height bars mean no edit was recorded in that interval, not necessarily zero progress.</p>`;}
function insights(){const r=insPeriodDates();return `${insHeader()}${!r.valid?insNoData('Enter valid start and end dates to view your information.'):insTab==='overview'?insOverview(r):insTab==='money'?insMoneyPanel(r):insTab==='tasks'?insTasksPanel(r):insTab==='time'?insTimePanel(r):insTab==='habits'?insHabitPanel(r):insGoalPanel(r)}<p class="ins-privacy">◈ Insights run locally. No analytics provider, automatic bank access, or cloud upload is connected.</p>`;}
function insNew(kind){const list={transaction:'transactions',time:'timeEntries',habit:'habits'}[kind];if(!list)return;const today=insToday();let fields='';if(kind==='transaction')fields=field('title','Description','','text','required maxlength="180" placeholder="e.g. Weekly wage"')+`<div class="form-cols">${field('amount','Amount (£)','','number','min="0.01" max="100000000" step="0.01" required')}${field('date','Date',today,'date','required')}</div>`+dropdown('kind','Money movement',[['income','Income received'],['expense','Expense paid']],'expense')+dropdown('category','Category',Object.entries(INS_CATS),'other')+area('note','Optional note','',2,'maxlength="1000"');
 if(kind==='time')fields=field('title','What did you do?','','text','required maxlength="160" placeholder="e.g. Evening workout"')+`<div class="form-cols">${field('date','Date',today,'date','required')}${field('minutes','Actual minutes',30,'number','min="1" max="1440" step="1" required')}</div>`+dropdown('category','Type',Object.entries(INS_TIME_CATS),'focus');
 if(kind==='habit')fields=field('title','Habit','','text','required maxlength="120" placeholder="e.g. Read for 20 minutes"')+dropdown('targetPerWeek','Target each week',[['7','Every day'],['5','5 days'],['3','3 days'],['2','2 days'],['1','Once']],'7');
 $('modal-root').innerHTML=`<div class="modalback" data-action="modal-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Add ${kind}"><div class="titlebar"><h2>${kind==='transaction'?'Add a transaction':kind==='time'?'Log actual time':'New habit'}</h2><button class="iconbtn" data-action="modal-close" aria-label="Close">×</button></div><form id="ins-edit-form" data-kind="${kind}">${fields}<p class="fine">Saved privately on this device; no automatic data import.</p><div role="alert" id="ins-form-error" class="status error" hidden></div><button class="action full" type="submit">Save record</button></form></div></div>`;setTimeout(()=>$('f-title')?.focus(),80);
}
function insSubmit(form){const kind=form.dataset.kind,v=Object.fromEntries(new FormData(form));let item;
 if(kind==='transaction')item=insNormalizeTransaction({...v,id:id()});
 if(kind==='time')item=insNormalizeTime({...v,id:id()});
 if(kind==='habit')item=insNormalizeHabit({...v,id:id()});
 if(!item||!item.title)throw Error('Enter valid information and a positive amount or duration.');
 const key={transaction:'transactions',time:'timeEntries',habit:'habits'}[kind];if(data[key].length>=10000)throw Error('This section reached its local record limit. Export a backup.');data[key].unshift(item);closeModal();commit('Saved to Insights');
}
function insDrill(metric,start,end){const r={start,end},t=metric==='transactions'?insEntries(data.transactions,r):metric==='time'?insEntries(data.timeEntries,r):metric==='habits'?insEntries(data.habitLogs,r):metric==='tasks'?data.tasks.filter(x=>insIn(insLondonDate(x.completedAt),r)||insIn(insLondonDate(x.createdAt),r)):metric==='balance'?insEntries(data.balanceHistory,r):[];
 let rows=t.map(x=>{const date=x.date||insLondonDate(x.completedAt)||insLondonDate(x.createdAt);const amount=metric==='transactions'?insMoney(x.amount):metric==='time'?insMinute(x.minutes):metric==='balance'?insMoney(x.value):metric==='tasks'?(x.done?'Completed':'Open'):'';const label=x.title||data.habits.find(h=>h.id===x.habitId)?.title||'Recorded value';return `<div class="ins-record"><div><b>${esc(label)}</b><small>${esc(date)} · ${esc(x.category||x.kind||'Record')}</small></div><strong>${esc(amount)}</strong></div>`}).join('');
 $('modal-root').innerHTML=`<div class="modalback" data-action="modal-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Graph records"><div class="titlebar"><h2>Source records</h2><button class="iconbtn" data-action="modal-close" aria-label="Close">×</button></div><p class="fine">${esc(start)} to ${esc(end)} · ${t.length} matching item(s)</p>${rows||insNoData('No individual entries recorded in this bucket.')}</div></div>`;
}
function insAction(element){const a=element.dataset.action;
 if(a==='ins-tab'){insTab=element.dataset.tab;return render()}
 if(a==='ins-period'){insPeriod=element.dataset.period;if(insPeriod==='custom'&&!insCustomStart){insCustomEnd=insToday();insCustomStart=dateAdd(insToday(),-29)}return render()}

/* Focus timer: local-only, wall-clock based so background tabs do not lose time. */
const ATLAS_FOCUS_KEY='atlas-focus-timer:v1';
let atlasFocus={minutes:25,remaining:1500,endsAt:0,running:false};
try{const stored=JSON.parse(localStorage.getItem(ATLAS_FOCUS_KEY)||'null');if(stored&&[15,25,45].includes(stored.minutes)&&Number.isFinite(stored.remaining)&&stored.remaining>=0&&stored.remaining<=2700&&Number.isFinite(stored.endsAt)&&typeof stored.running==='boolean')atlasFocus=stored}catch{}
function atlasFocusRemaining(){return atlasFocus.running?Math.max(0,Math.ceil((atlasFocus.endsAt-Date.now())/1000)):atlasFocus.remaining}
function atlasFocusSave(){try{localStorage.setItem(ATLAS_FOCUS_KEY,JSON.stringify(atlasFocus))}catch{}}
function atlasFocusTick(){
 if(atlasFocus.running&&atlasFocusRemaining()===0){atlasFocus.running=false;atlasFocus.remaining=0;atlasFocus.endsAt=0;atlasFocusSave()}
 const el=document.getElementById('atlas-focus-clock');
 if(el){const n=atlasFocusRemaining();el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');const status=document.getElementById('atlas-focus-status');if(status)status.textContent=n===0?'Session complete':atlasFocus.running?'Focus session running':'Ready when you are';}
}

function atlasFocusAction(el){

 if(a==='focus-preset'){const m=Number(el.dataset.minutes);if(![15,25,45].includes(m))return;atlasFocus={minutes:m,remaining:m*60,endsAt:0,running:false}}
 if(a==='focus-reset')atlasFocus={minutes:atlasFocus.minutes,remaining:atlasFocus.minutes*60,endsAt:0,running:false};

function atlasDecisionPick(options){if(!Array.isArray(options)||options.length<2)return -1;const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const range=0x100000000,limit=range-(range%options.length);let value;do{crypto.getRandomValues(bytes);value=bytes[0]}while(value>=limit);return value%options.length}

const atlasJournalEntries=()=>data.notes.filter(n=>n.journal===true&&n.journalDate&&validDate(n.journalDate)).sort((a,b)=>b.journalDate.localeCompare(a.journalDate)||(b.updatedAt||0)-(a.updatedAt||0));
/* Private, human-readable export. Saved journal notes only; no other workspace records. */
function atlasJournalTextExport(entries){
 const ordered=[...entries].sort((a,b)=>a.journalDate.localeCompare(b.journalDate));
 const lines=['ATLAS PRIVATE JOURNAL','Saved entries: '+ordered.length,''];
 for(const entry of ordered){
  lines.push('Date: '+entry.journalDate,'Mood: '+atlasJournalMood(entry.mood)[1],
   'Energy: '+(Number.isInteger(entry.energy)&&entry.energy>=1&&entry.energy<=5?entry.energy:3)+'/5',
   'Tags: '+(Array.isArray(entry.tags)?entry.tags.join(', '):''),'',
   String(entry.body||'').replace(/\r\n?/g,'\n'),'','────────────────────────','');
 }
 return lines.join('\n');
}
function atlasDownloadJournal(){
 const entries=atlasJournalEntries();
 if(!entries.length)return showToast('Save a journal entry before exporting.');
 const filename='atlas-journal-'+dateKey()+'.txt';
 const content=atlasJournalTextExport(entries);
 const file=new File([content],filename,{type:'text/plain;charset=utf-8'});
 if(navigator.canShare?.({files:[file]})){
  navigator.share({title:'ATLAS private journal',files:[file]}).catch(error=>{
   if(error.name!=='AbortError')showToast('Could not share journal. Try again.');
  });
  return;
 }
 calDownload(filename,content,'text/plain;charset=utf-8');
 showToast('Journal exported. Keep this file private.');
}
/* Warn only when the visible Journal form differs from the saved entry.
   Nothing is autosent, and a cancelled navigation leaves every field intact. */
function atlasJournalHasUnsavedChanges(){
 if(page!=='journal')return false;
 const form=$('atlas-journal-form');
 if(!form)return false;
 const selected=atlasJournalEntries().find(n=>n.journalDate===atlasJournalDate);
 const field=name=>String(form.elements.namedItem(name)?.value??'');
 return field('body')!==(selected?.body||'')
  || field('mood')!==(selected?.mood||'okay')
  || field('energy')!==String(selected?.energy||3)
  || field('tags')!==(selected?.tags||[]).join(', ');
}
function atlasJournalConfirmDiscard(){
 return !atlasJournalHasUnsavedChanges()||confirm('You have unsaved journal changes. Discard them and leave?');

function searchScreen(){
 const q=searchText.trim().toLocaleLowerCase(),results=[];
 const matches=(values)=>values.some(x=>String(x??'').toLocaleLowerCase().includes(q));
 if(q){
  for(const t of data.tasks)if(matches([t.title,t.details,projectName(t.projectId)]))results.push(['task',t.id,t.title,t.done?'Completed task':'Task']);
  for(const p of data.projects)if(matches([p.title,p.description]))results.push(['project',p.id,p.title,'Project']);
  for(const n of data.notes)if(matches([n.title,n.body]))results.push(['note',n.id,n.title,'Note']);
  for(const g of data.goals)if(matches([g.title]))results.push(['goal',g.id,g.title,'Goal']);
  for(const m of data.money)if(matches([m.title]))results.push(['money',m.id,m.title,m.kind==='debt'?'Debt':'Bill']);
  for(const e of data.calendarEvents)if(matches([e.title,e.details,e.startDate,e.category]))results.push(['event',e.id,e.title,'Calendar · '+calFormatDate(e.startDate)+(e.allDay?' · All day':' · '+e.startTime)]);
  for(const t of data.transactions)if(matches([t.title,t.note,t.date,t.category,t.kind]))results.push(['transaction',t.id,t.title,(t.kind==='income'?'Income':'Expense')+' · '+t.date]);
  for(const t of data.timeEntries)if(matches([t.title,t.date,t.category]))results.push(['timeEntry',t.id,t.title,'Time log · '+t.date]);
  for(const h of data.habits)if(!h.archived&&matches([h.title]))results.push(['habit',h.id,h.title,'Habit']);
 }
 return `<div class="eyebrow">FIND ANYTHING</div><h1>Search</h1><div class="capture"><input id="search-input" class="input" autocomplete="off" placeholder="Tasks, events, notes, money…" value="${esc(searchText)}" aria-label="Search ATLAS"><button class="action ghost" data-action="clear-search" aria-label="Clear search">×</button></div><p class="fine" style="margin:0 0 13px" role="status" aria-live="polite">${q?`${results.length} results${results.length>150?' · showing first 150':''}`:'Search tasks, calendar events, notes, projects, goals and recorded finances on this device. Nothing is sent to a server.'}</p><div class="card">${results.length?results.slice(0,150).map(([type,rid,title,label])=>`<button class="search-result" data-action="result" data-type="${type}" data-id="${esc(rid)}"><b>${esc(title)}</b><small>${esc(label)}</small></button>`).join(''):blank('⌕',q?'Nothing matched. Try another word.':'Search for a task, note or date to get started.')}</div>`;
}

/* Voice capture: browser speech API, explicit opt-in, editor review required. */
let atlasVoiceRec=null;
function atlasVoiceStop(silent=true){const rec=atlasVoiceRec;atlasVoiceRec=null;if(rec){rec.onresult=rec.onerror=rec.onend=null;try{rec.abort()}catch(_){}}if(!silent&&$('voice-status'))$('voice-status').textContent='Stopped. Nothing has been saved.'}
function atlasVoiceMessage(msg){if($('voice-status'))$('voice-status').textContent=msg}
function atlasVoiceOpen(){
 atlasVoiceStop();modalState={type:'voice'};
 const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
 $('modal-root').innerHTML='<div class="modalback" data-action="modal-bg"><div class="sheet voice-sheet" role="dialog" aria-modal="true" aria-label="Voice capture"><div class="titlebar"><h2>Voice capture</h2><button data-action="modal-close" class="iconbtn" aria-label="Close">×</button></div><p class="sub">Tell ATLAS what you are doing and when. Review before saving.</p><div class="field"><label for="voice-kind">Save as</label><select id="voice-kind" class="select"><option value="event">Calendar event</option><option value="task">Task</option></select></div><div class="field"><label for="voice-text">Your words</label><textarea id="voice-text" class="textarea" maxlength="3000" placeholder="Pick up Noah tomorrow at 3 pm"></textarea></div><div class="voice-actions"><button data-action="voice-listen" class="action ghost" '+(supported?'':'disabled')+'>🎙 Speak</button><button data-action="voice-stop" class="action ghost">Stop</button></div><p id="voice-status" role="status" aria-live="polite" class="voice-status">'+(supported?'Tap Speak to start.':'Speech recognition unavailable here. Type instead.')+'</p><button data-action="voice-review" class="action full">Review in editor →</button><p class="voice-note">Your browser may use an online speech service. ATLAS does not keep audio or save anything until you confirm it in the editor.</p></div></div>';
 setTimeout(()=>$('voice-text')?.focus(),20);
}
function atlasVoiceListen(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R||!isSecureContext){atlasVoiceMessage('Speech recognition unavailable. Type instead.');return}
 atlasVoiceStop();
 try{const r=new R();atlasVoiceRec=r;r.lang='en-GB';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
 r.onresult=e=>{if(atlasVoiceRec!==r)return;const spoken=String(e.results?.[0]?.[0]?.transcript||'');if($('voice-text'))$('voice-text').value=spoken.slice(0,3000);atlasVoiceMessage('Transcript ready. Review it below.')};
 r.onerror=e=>{if(atlasVoiceRec===r)atlasVoiceMessage(e.error==='not-allowed'?'Microphone denied. Type instead.':'Could not recognise speech. Type or retry.')};
 r.onend=()=>{if(atlasVoiceRec===r){atlasVoiceRec=null;if($('voice-status')?.textContent==='Listening…')atlasVoiceMessage('Listening ended. Review or try again.')}};
 r.start();atlasVoiceMessage('Listening…');
 }catch(_){atlasVoiceRec=null;atlasVoiceMessage('Microphone unavailable. Type instead.')}
}
function atlasVoiceReview(){
 const text=String($('voice-text')?.value||'').trim();if(!text){atlasVoiceMessage('Speak or type first.');return}
 if(text.length>240){atlasVoiceMessage('Shorten to 240 characters first.');return}
 const kind=$('voice-kind')?.value;let parsed;
 try{parsed=calParseQuick(text)}catch(e){atlasVoiceMessage('Check the date or time: '+e.message);return}
 atlasVoiceStop();
 if(kind==='event'){
  calOpenEvent('','',parsed.startDate,parsed.startTime);const form=$('cal-event-form');if(!form)return;
  for(const [k,v] of Object.entries({title:parsed.title,startDate:parsed.startDate,startTime:parsed.startTime,durationMins:parsed.durationMins,repeat:parsed.repeat})){const el=form.elements.namedItem(k);if(el)el.value=String(v)}
  const box=form.elements.namedItem('allDay');if(box)box.checked=parsed.allDay;
  showToast('Review your event, then Add to calendar.');
 }else{
  openModal('task');const form=$('edit-form');if(!form)return;
  const set=(k,v)=>{const el=form.elements.namedItem(k);if(el)el.value=v};
  set('title',parsed.title);
  if(/\b(?:today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|in\s+\d+\s+days?)\b|\b\d{4}-\d\d-\d\d\b/i.test(text))set('due',parsed.startDate);
  if(/\b\d{1,2}(?::[0-5]\d)?\s*(?:am|pm)\b|\b(?:[01]?\d|2[0-3]):[0-5]\d\b/i.test(text)){set('planned',parsed.startDate);set('scheduledTime',parsed.startTime)}
  showToast('Review your task, then Save.');
 }
}

 const finger=Array.from(e.changedTouches).find(t=>t.identifier===swipe.id);if(!finger)return;

/* Touch pointer gestures are conservative: edge swipes and scrolling always win. */
let atlasTaskTouch=null,atlasGestureClickBlockUntil=0,atlasCalendarDayTouch=null;
function atlasResetTaskTouch(){
 const x=atlasTaskTouch;atlasTaskTouch=null;
 if(!x)return;clearTimeout(x.timer);
 if(x.body?.isConnected){x.body.style.transform='';x.body.style.transition='';x.body.closest('.task')?.removeAttribute('data-atlas-swipe')}
}
document.addEventListener('pointerdown',e=>{
 if(!['touch','pen'].includes(e.pointerType)||e.isPrimary===false||e.button!==0)return;
 if(e.clientX<28||e.clientX>innerWidth-28||$('modal-root').children.length)return;
 const body=e.target.closest('.taskbody'),row=body?.closest('.task');
 if(!row||!byId(data.tasks,row.dataset.task))return;
 atlasResetTaskTouch();
 const touch={id:e.pointerId,ref:row.dataset.task,body,x:e.clientX,y:e.clientY,dx:0,dy:0,timer:null};
 touch.timer=setTimeout(()=>{
  if(atlasTaskTouch!==touch||Math.abs(touch.dx)>9||Math.abs(touch.dy)>9)return;
  atlasGestureClickBlockUntil=Date.now()+650;
  atlasResetTaskTouch();atlasTaskMenu(touch.ref);
 },560);
 atlasTaskTouch=touch;
},{passive:true});
document.addEventListener('pointermove',e=>{
 const x=atlasTaskTouch;if(!x||x.id!==e.pointerId)return;
 x.dx=e.clientX-x.x;x.dy=e.clientY-x.y;
 if(Math.abs(x.dy)>16&&Math.abs(x.dy)>Math.abs(x.dx)){atlasResetTaskTouch();return}
 if(Math.abs(x.dx)>9||Math.abs(x.dy)>9)clearTimeout(x.timer);
 if(Math.abs(x.dx)>13&&Math.abs(x.dx)>Math.abs(x.dy)*1.5&&x.body?.isConnected){
  x.body.style.transition='none';
  x.body.style.transform=`translateX(${Math.max(-30,Math.min(30,x.dx/3))}px)`;
  x.body.closest('.task')?.setAttribute('data-atlas-swipe',x.dx>0?'right':'left');
 }
},{passive:true});

 const x=atlasTaskTouch;if(!x||x.id!==e.pointerId)return;

/* Timetable blocks retain their Calendar event IDs and original repeat rules. */
let atlasTimetableDesktopDrag=null,atlasTimetableGripPointer=null,atlasTimetableBlockClickUntil=0;
function atlasMoveTimetable(ref,day){
 const event=byId(data.calendarEvents,ref);
 if(!event||event.timetable!==true||event.repeat!=='weekly'||!Number.isInteger(day)||day<0||day>6)return;
 if(atlasDayIndex(event.startDate)===day)return;
 const before=event.startDate,after=dateAdd(calStartWeek(before),day);
 const clash=atlasTimetableBlocks().some(b=>b.id!==ref&&atlasDayIndex(b.startDate)===day&&calMins(b.startTime)<calMins(event.startTime)+event.durationMins&&calMins(event.startTime)<calMins(b.startTime)+b.durationMins);
 if(clash&&!confirm('This block overlaps another weekly block. Move it anyway?'))return;
 const exceptions=clone(event.exceptions||{});
 event.startDate=after;event.exceptions={};atlasTimetableDay=day;
 commit('Weekly block moved');
 if(!storageLoadError&&!storageWarning)atlasOfferUndo('Moved to '+ATLAS_WEEKDAYS[day],{kind:'timetable',ref,before,after,exceptions});
}
